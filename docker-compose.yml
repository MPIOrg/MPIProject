version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mpi_database
    environment:
      MYSQL_DATABASE: smartwallet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./MPI.sql:/docker-entrypoint-initdb.d/init.sql 
    networks:
      - mpi_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpi_backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/smartwallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - mpi_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mpi_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mpi_network

volumes:
  db_data:

networks:
  mpi_network:
    driver: bridge